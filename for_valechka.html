<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Для Валечки!!</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle, #35213d, #130e1b);
    font-family: monospace;
    color: #ffd6e7;
    overflow: hidden;
}

.container {
    width: 100%;
    height: 100vh;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.bouquet {
    display: block;
    white-space: pre;
    font-size: 10px;
    line-height: 1;
    color: #ffb8d2;
    text-align: left;
    text-shadow: 0 0 8px #ff6fa9;
    transform-origin: top left;
    flex-shrink: 0;
    margin: 0;
}

h1 {
    margin-top: 15px;
    margin-bottom: 5px;
    font-family: Georgia, serif;
    font-size: clamp(22px, 6vw, 42px);
    color: #ffb6d1;
    text-shadow: 0 0 15px #ff4d91;
    opacity: 0;
    transition: opacity 1.5s;
    text-align: center;
}

p {
    color: #e6b7d0;
    font-size: clamp(12px, 3vw, 15px);
    opacity: 0;
    transition: opacity 1.5s;
    text-align: center;
}

/* Скрываем поле с исходным рисунком */
#artSource {
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <pre class="bouquet" id="bouquet"></pre>

    <h1>Валечка, не грусти пжпж</h1>

<script>

// Получаем рисунок из скрытого текстового поля
const art = document.getElementById("artSource").value.trim();

const bouquet = document.getElementById("bouquet");

const title = document.querySelector("h1");
const subtitle = document.querySelector("p");

let index = 0;


// Подгоняем букет под экран
function resizeBouquet() {

    const lines = art.split("\n");

    const maxWidth = Math.max(
        ...lines.map(line => line.length)
    );

    const height = lines.length;

    const availableWidth = window.innerWidth - 20;
    const availableHeight = window.innerHeight * 0.75;

    // Приблизительная ширина одного символа
    const widthSize = availableWidth / (maxWidth * 0.6);

    // Высота одной строки
    const heightSize = availableHeight / height;

    // Выбираем размер, который позволит уместить весь рисунок
    const fontSize = Math.min(
        16,
        widthSize,
        heightSize
    );

    bouquet.style.fontSize = Math.max(2, fontSize) + "px";
}


// Пересчитываем размер при изменении экрана
resizeBouquet();

window.addEventListener("resize", resizeBouquet);


// Скорость прорисовки
const speed = 50;


function draw() {

    if (index < art.length) {

        bouquet.textContent += art.slice(
            index,
            index + speed
        );

        index += speed;

        requestAnimationFrame(draw);

    } else {

        // Показываем надписи после появления букета
        title.style.opacity = "1";
        subtitle.style.opacity = "1";

    }

}


// Запускаем прорисовку
draw();

</script>
